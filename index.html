<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      콘텐츠 보안 정책 — 개인정보 수집·외부 전송이 없다는 원칙을 브라우저 차원에서 강제한다.
      connect-src 'self': 같은 출처(같은 폴더의 data/*.json)만 불러오고, 어떤 외부 서버로도
      데이터를 보내지 못하게 막는다. 인라인 스타일/스크립트는 단일 파일 오프라인 빌드가
      모든 자원을 문서 안에 넣기 때문에 허용한다. data:는 내장 파비콘·폰트용.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: 'unsafe-inline'; connect-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <!-- 파비콘은 오프라인 단일 파일 배포를 위해 data URI로 내장 -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f6df5'/%3E%3Ccircle cx='38' cy='42' r='14' fill='none' stroke='%23fff' stroke-width='7'/%3E%3Cline x1='49' y1='53' x2='66' y2='70' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='70' cy='32' r='9' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />
    <title>미디어 리터러시 퀘스트</title>
    <meta
      name="description"
      content="초등 5~6학년을 위한 미디어·AI 리터러시 교육용 웹 게임 16종(4부 16차시) — 추천 알고리즘·인공지능·디지털 시민성·AI 윤리를 놀이로 배워요. 설치·로그인·개인정보 수집 없이 브라우저만으로."
    />
    <!-- 공유 미리보기 카드 (카톡·밴드 등). 오프라인 원칙을 지키려 og:image는 넣지 않음 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🔍 미디어 리터러시 퀘스트" />
    <meta
      property="og:description"
      content="초등 5~6학년 미디어·AI 리터러시 웹 게임 16종. 설치·로그인·개인정보 수집 없이 브라우저만으로."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🔍 미디어 리터러시 퀘스트" />
    <meta
      name="twitter:description"
      content="초등 5~6학년 미디어·AI 리터러시 웹 게임 16종. 설치·로그인 없이 브라우저만으로."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
