<!doctype html>
<!--
  GitHub Pages용 404 구제 페이지.
  이 앱은 HashRouter를 쓰므로 올바른 주소는 /#/games/... 형태다.
  교사·학생이 #을 빠뜨리고 /games/... 로 접속하면 서버 404가 나는데,
  이 페이지가 같은 경로의 해시 라우트로 자동 이동시켜 준다.
  (프로젝트 페이지 기준: /저장소이름/games/... → /저장소이름/#/games/...)
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>미디어 리터러시 퀘스트</title>
    <script>
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        // 프로젝트 페이지면 첫 조각이 저장소 이름(base), 루트 배포면 base 없음.
        // index.html이 존재하는 가장 가까운 상위를 알 수 없으므로,
        // 첫 조각을 base로 가정해 보고 아니면 루트로 보낸다.
        var base = parts.length > 1 ? "/" + parts[0] + "/" : "/";
        var rest = parts.length > 1 ? parts.slice(1).join("/") : parts.join("/");
        location.replace(location.origin + base + "#/" + rest + location.search);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 3rem">
      퀘스트 지도로 이동 중이에요…
      <a href="./">바로 가기</a>
    </p>
  </body>
</html>
